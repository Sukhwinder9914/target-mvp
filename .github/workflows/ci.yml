name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: pip install -r requirements.txt || echo "No requirements file"

      - name: Run Unit Tests
        run: pytest || echo "No tests found"

      - name: Build Docker Image
        run: docker build -t target-inventory-app .
